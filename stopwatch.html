<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch Web App</title>
    <link rel="stylesheet" href="stopwatch.css">
</head>
<body>
    <div class="all-stopwatch">
        <header>Stopwatch Web Application</header>
        <section class="stopwatch">
            <div class="time">
                <span id="h"> 0 h : </span>
                <span id="min"> 0 min : </span>
                <span id="s"> 0 s : </span>
                <span id="ms"> 0 ms</span>
            </div>
            <ul class="value-list"></ul>
            <div class="boutton">
                <button id="start" onclick="start()">Start</button>
                <button id="stop" onclick="stop()">Stop</button>
                <button id="saveTime" onclick="saveTime()">Save Time</button>
                <button id="reset" onclick="reset()">Reset</button>
            </div>
        </section>
    </div>
    <script src="stopwatch.js"></script>
</body>
</html>
